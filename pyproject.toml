[project]
name = "social-media"
version = "0.1.0"
description = ""
authors = [
    {name = "Anderson Andrade Silva",email = "ander.math89@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "tortoise-orm[asyncpg] (>=0.25.3,<0.26.0)",
    "tree (>=0.2.4,<0.3.0)",
]

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
dev = 'fastapi dev social_media/api/application.py'
prod = 'uvicorn social_media.api.application:app --host 0.0.0.0 --port 8000 --reload'
pre_test = 'task lint'
test = 'pytest -s -x --cov=fast_zero -vv'
post_test = 'coverage html'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.13,<0.15.0)",
    "black (>=25.12.0,<26.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
